name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    name: smoke
    if: "!startsWith(github.head_ref, 'release-please--')"
    steps:
      - uses: actions/checkout@v6

      - name: create values fixture
        run: |
          mkdir -p fixture
          printf 'api:\n  image:\n    repository: example/api\n    tag: 1.0.0\n' > fixture/values.yaml

      - id: rollout
        uses: ./
        with:
          file: fixture/values.yaml
          mode: key
          key: api.image.tag
          value: 2.0.0
          token: ${{ github.token }}
          dry_run: "true"

      - name: assert outputs
        env:
          DIFF: ${{ steps.rollout.outputs.diff }}
          FILES: ${{ steps.rollout.outputs.changed_files }}
        run: |
          echo "diff: $DIFF"
          echo "changed_files: $FILES"
          echo "$FILES" | grep -q 'fixture/values.yaml'
          echo "$DIFF" | grep -q '2.0.0'
